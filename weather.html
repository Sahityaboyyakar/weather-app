<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <link rel="stylesheet" href="weather.css">
</head>
<body>
    <h1 class="weather">Weather Forecast</h1>
    <div class="div">
        <input class="forms" id="cityname" type="text" placeholder="Enter the City" >
        <button class="forme" id="buttonid" type="submit">Search</button>
        <div class="container">
            <h3 class="fero">Live Details</h3>
            <p id="para" class="paragraph">Temperature:</p>
            <p id="para1" class="paragraph">Pressure:</p>
            <p id="para2" class="paragraph">Humidiity:</p>
            <p id="para3" class="paragraph">Wind Speed</p>
        </div>
 </div>
</body>
<script>
    function init(weatherData) {
        document.body.style.backgroundRepeat = 'no-repeat';
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center';
        switch (weatherData.weather[0].main) {
            case 'Clear':
                document.body.style.backgroundImage = "C:\Users\aniru\Downloads\premium_photo-1727730047398-49766e915c1d.jpeg";
                break;
            case 'Clouds':
                document.body.style.backgroundImage = "C:\Users\aniru\Downloads\images (4).jpeg";
                break;
            case 'Rain':
            case 'Drizzle':
                document.body.style.backgroundImage = "C:\Users\aniru\Downloads\images (5).jpeg";
                break;
            case 'Mist':
                document.body.style.backgroundImage = "c:\Users\aniru\Downloads\images (6).jpeg";
                break;
            case 'Thunderstorm':
                document.body.style.backgroundImage = "c:\Users\aniru\Downloads\istockphoto-993959156-612x612.jpg";
                break;
            case 'Snow':
                document.body.style.backgroundImage = "c:\Users\aniru\Downloads\istockphoto-614332492-612x612.jpg";
                break;
        }
    }

    async function getWeather(city) {
        const API_KEY = "4767455b1ffd7c81c6ee5ee22627c7d2";
        try {
            const res = await fetch(https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric);
            
            if (!res.ok) {
                throw new Error(HTTP error! Status: ${res.status});
            }

            const data = await res.json();
            
            document.getElementById("para").textContent = Temperature: ${data.main.temp}°C;
            document.getElementById("para1").textContent = Pressure: ${data.main.pressure} hPa;
            document.getElementById("para2").textContent = Humidity: ${data.main.humidity}%;
            document.getElementById("para3").textContent = Wind Speed: ${data.wind.speed} m/s;

            init(data);
        } catch(error) {
            console.error('Error fetching weather data:', error);
            // document.getElementById("weatherOutput").textContent = 'Error: ' + error.message;
        }
    }

    document.getElementById("buttonid").addEventListener("click", function(){
        const city = document.getElementById("cityname").value;
        getWeather(city);
    });
</script>
</html>
